services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-iku-admin-2026}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
    volumes:
      - db-data:/app/prisma
    restart: unless-stopped
    networks:
      - milktea-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - milktea-net

networks:
  milktea-net:
    driver: bridge

volumes:
  db-data:
