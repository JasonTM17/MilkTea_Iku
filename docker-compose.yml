services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./backend/prisma/dev.db
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-iku-admin-2026}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
    volumes:
      - db-data:/app/backend/prisma
    restart: unless-stopped
    networks:
      - milktea-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - milktea-net

  n8n:
    image: n8nio/n8n:latest
    container_name: milktea-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-milktea-n8n-2026}
      - WEBHOOK_URL=http://n8n:5678/
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - milktea-net

networks:
  milktea-net:
    driver: bridge

volumes:
  db-data:
  n8n-data:
