<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Cup body with gradient -->
  <defs>
    <linearGradient id="cupGrad" x1="20" y1="25" x2="56" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8923a"/>
      <stop offset="100%" stop-color="#c25f20"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="22" y1="17" x2="58" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8ee"/>
      <stop offset="100%" stop-color="#f5e6d0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="75" y1="30" x2="200" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a170c"/>
      <stop offset="100%" stop-color="#5a2d1a"/>
    </linearGradient>
  </defs>
  <!-- Cup body -->
  <path d="M22 26h36l-3.5 38c-.4 4.5-3.8 7-8 7H33.5c-4.2 0-7.6-2.5-8-7L22 26z" fill="url(#cupGrad)"/>
  <!-- Cup lid -->
  <path d="M19 21a3 3 0 013-3h36a3 3 0 013 3v3a1 1 0 01-1 1H20a1 1 0 01-1-1v-3z" fill="#3a170c"/>
  <!-- Lid shine -->
  <rect x="24" y="19.5" width="12" height="2" rx="1" fill="#5a3520" opacity="0.5"/>
  <!-- Straw -->
  <path d="M46 6c.5 0 1 .5 1 1l2 18h-4l1-18c0-.5.5-1 1-1z" fill="#c25f20" transform="rotate(6 46 15)"/>
  <!-- Straw bend -->
  <circle cx="47.5" cy="6" r="2" fill="#c25f20"/>
  <!-- Cream top -->
  <path d="M23 25c0-3 5.5-6 17-6s17 3 17 6" fill="url(#creamGrad)"/>
  <!-- Cream swirl -->
  <path d="M28 22c3-2 8-2.5 12-1.5s8 1 11 0" stroke="#e8d5b8" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Boba pearls -->
  <circle cx="30" cy="55" r="3.5" fill="#2a0f06"/>
  <circle cx="38" cy="59" r="3" fill="#2a0f06" opacity="0.9"/>
  <circle cx="46" cy="54" r="3.5" fill="#2a0f06"/>
  <circle cx="34" cy="49" r="2.5" fill="#2a0f06" opacity="0.7"/>
  <circle cx="42" cy="48" r="2.5" fill="#2a0f06" opacity="0.7"/>
  <!-- Pearl highlights -->
  <circle cx="29" cy="54" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="45" cy="53" r="1" fill="#fff" opacity="0.3"/>
  <!-- Brand name: "MilkTea" as paths -->
  <path d="M75 44V30h2.5l5.5 9 5.5-9H91v14h-2.2V34l-5 8h-1.5l-5-8v10H75z" fill="url(#textGrad)"/>
  <path d="M95 33v-3h2.2v3H95zm0 11V35h2.2v9H95z" fill="url(#textGrad)"/>
  <path d="M100 44V30h2.2v14H100z" fill="url(#textGrad)"/>
  <path d="M105 44V30h2.2v11.5h5.5V44H105z" fill="url(#textGrad)"/>
  <path d="M114 44V30h2.2v6l5.5-6h2.8l-5.8 6.2 6 7.8h-2.8l-4.8-6.3-.9 1V44H114z" fill="url(#textGrad)"/>
  <path d="M127 44V32h-4v-2h10.2v2h-4v12H127z" fill="url(#textGrad)"/>
  <path d="M136 40.5c.1 1.5 1.5 2.2 3.2 2.2 1.4 0 2.5-.5 2.5-1.5 0-1-.8-1.3-2.5-1.7l-1.5-.3c-2.2-.5-3.5-1.3-3.5-3.2 0-2 1.8-3.3 4.3-3.3 2.8 0 4.5 1.4 4.6 3.5h-2.2c-.1-1.2-1.2-1.8-2.5-1.8-1.3 0-2.2.6-2.2 1.4 0 .9.7 1.2 2.2 1.5l1.5.3c2.5.5 3.8 1.4 3.8 3.3 0 2.2-1.9 3.4-4.7 3.4-2.9 0-4.8-1.4-5-3.8H136z" fill="url(#textGrad)"/>
  <!-- Brand name: "Iku" as paths (larger, brand color) -->
  <path d="M75 65V51h3v14H75z" fill="#d4792a"/>
  <path d="M82 65V51h3v5.5l5-5.5h3.8l-5.5 5.8L94 65h-3.8l-4.2-5.8-1 1.1V65H82z" fill="#d4792a"/>
  <path d="M96 60.5V51h3v9.2c0 1.8 1 2.8 2.8 2.8s2.8-1 2.8-2.8V51h3v9.5c0 3.2-2.2 5-5.8 5s-5.8-1.8-5.8-5z" fill="#d4792a"/>
  <!-- Decorative accent -->
  <circle cx="112" cy="51" r="1.5" fill="#d4792a" opacity="0.6"/>
  <!-- Tagline dots -->
  <circle cx="75" cy="72" r="1.2" fill="#d4792a" opacity="0.4"/>
  <circle cx="80" cy="72" r="1.2" fill="#e9bc7d" opacity="0.5"/>
  <circle cx="85" cy="72" r="1.2" fill="#d4792a" opacity="0.3"/>
</svg>
